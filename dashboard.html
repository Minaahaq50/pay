<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لوحة الامتحانات | الصف الثالث الثانوي</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
    <div class="bg-orb">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Premium Navbar -->
    <nav class="glass-nav">
        <div class="logo-area">
            <i class="fas fa-graduation-cap"></i>
            <span>Exam<span class="highlight">Hub</span></span>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن مادة..." class="search-input">
        </div>
        <div class="user-profile" id="userProfileBtn">
            <div class="avatar" id="userAvatar">
                <i class="fas fa-user-astronaut"></i>
            </div>
            <span id="userNameDisplay">مرحباً</span>
            <i class="fas fa-chevron-down"></i>
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="user-info-drop">
                    <p id="dropdownUserName">أحمد</p>
                    <small id="dropdownUserEmail">user@example.com</small>
                </div>
                <hr>
                <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="dashboard-container">
        <div class="welcome-banner">
            <div class="greeting">
                <h1>مرحباً بك في منصة الامتحانات <span id="greetingUserName">الطالب</span> 🎓</h1>
                <p>اختر مادتك الدراسية وابدأ التحدي - ثانوية عامة 2026</p>
            </div>
            <div class="stats-chip">
                <i class="fas fa-star-of-life"></i>
                <span>المواد المدفوعة: <strong id="premiumCount">0</strong></span>
            </div>
        </div>

        <!-- Filters / Categories -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">جميع المواد</button>
            <button class="filter-btn" data-filter="free">مجانية</button>
            <button class="filter-btn" data-filter="premium">مدفوعة</button>
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjectsGrid">
            <!-- dynamic cards injected via js -->
        </div>
    </main>

    <!-- Premium Subscription Popup -->
    <div id="subscriptionModal" class="modal-overlay">
        <div class="modal-glass">
            <div class="modal-header">
                <i class="fas fa-crown crown-icon"></i>
                <h3>الاشتراك المميز</h3>
                <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p>للوصول إلى <strong id="modalSubjectName">المادة</strong> يلزمك الاشتراك في الباقة الذهبية.</p>
                <div class="benefits">
                    <span><i class="fas fa-check-circle"></i> جميع المواد المدفوعة</span>
                    <span><i class="fas fa-check-circle"></i> نماذج امتحانات تفاعلية</span>
                    <span><i class="fas fa-check-circle"></i> تقارير متقدمة</span>
                </div>
                <button id="confirmSubscribeBtn" class="premium-btn">اشترك الآن <i class="fas fa-arrow-left"></i></button>
                <button class="cancel-btn" id="cancelModalBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Loading Toast Style (Small toast) -->
    <div id="customToast" class="custom-toast"></div>
    <div id="loadingOverlay" class="loading-overlay-dash"><div class="spinner-dash"></div></div>

    <script src="firebase-config.js1"></script>
    <script src="dashboard.js"></script>
</body>
  </html>
