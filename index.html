<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إثبات التحويل - المنصة الثانوية بلس</title>
<style>
body{
  font-family: "Cairo", sans-serif;
  background:#0d0d0d;
  color:white;
  padding:20px;
}
.container{
  max-width:420px;
  margin:auto;
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px #000;
}
h2{
  text-align:center;
  color:#00f5c4;
}
label{display:block;margin-top:10px;font-weight:bold;}
input,button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-top:6px;
  font-size:15px;
}
input{
  background:#222;
  color:#fff;
}
button{
  background:#00f5c4;
  color:#111;
  cursor:pointer;
  margin-top:14px;
  font-weight:bold;
}
button:disabled{opacity:0.6;cursor:not-allowed;}
#status{text-align:center;margin-top:10px;font-size:14px;}
.preview{
  text-align:center;
  margin-top:10px;
}
.preview img{
  max-width:200px;
  border-radius:8px;
  border:1px solid #333;
}
</style>
</head>
<body>

<div class="container">
  <h2>📤 إثبات التحويل</h2>

  <label>الاسم المسجل في المنصة</label>
  <input type="text" id="name" placeholder="مثال: محمد علي">

  <label>الرقم المسجل في المنصة</label>
  <input type="text" id="studentNumber" placeholder="مثال: 010xxxxxxx">

  <label>الرقم الذي تم التحويل منه</label>
  <input type="text" id="fromNumber" placeholder="مثال: 011xxxxxxx">

  <label>صورة إيصال التحويل (سكرين)</label>
  <input type="file" id="image" accept="image/*">

  <button id="sendBtn">إرسال إلى البوت</button>

  <div id="status"></div>
  <div class="preview" id="preview"></div>
</div>

<script>
// ضع هنا بيانات بوتك:
const BOT_TOKEN = "7671449403:AAEi3OueRekWgJBNWivgR5gbuQT4b3drSP4";
const CHAT_ID = "7498653159"; // مثال: -1001234567890 لمجموعة أو 123456789 لحسابك

const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const preview = document.getElementById("preview");

sendBtn.addEventListener("click", async ()=>{
  const name = document.getElementById("name").value.trim();
  const studentNumber = document.getElementById("studentNumber").value.trim();
  const fromNumber = document.getElementById("fromNumber").value.trim();
  const file = document.getElementById("image").files[0];

  if(!name || !studentNumber || !fromNumber || !file){
    statusEl.innerHTML = "❌ الرجاء ملء كل الحقول واختيار الصورة.";
    return;
  }

  statusEl.innerHTML = "⏳ جاري الإرسال...";
  sendBtn.disabled = true;

  try{
    const caption = `
📸 *إثبات تحويل جديد*  
👤 الاسم: ${name}
📱 رقم المنصة: ${studentNumber}
💳 رقم المحول منه: ${fromNumber}
🕒 الوقت: ${new Date().toLocaleString("ar-EG")}
`.trim();

    // نرسل الصورة باستخدام Telegram API مباشرة
    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("caption", caption);
    formData.append("parse_mode", "Markdown");
    formData.append("photo", file);

    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    if(data.ok){
      statusEl.innerHTML = "✅ تم إرسال الإثبات بنجاح إلى البوت.";
      preview.innerHTML = `<img src="${URL.createObjectURL(file)}">`;
    }else{
      statusEl.innerHTML = "❌ حدث خطأ أثناء الإرسال.<br>" + (data.description || "");
    }
  }catch(err){
    console.error(err);
    statusEl.innerHTML = "❌ فشل الاتصال أو حدث خطأ.";
  }finally{
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
