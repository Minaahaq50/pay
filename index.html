<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>منصة امتحانات الثانوية العامة | تسجيل الدخول</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    <div class="glass-container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
            <button class="tab-btn" data-tab="register">إنشاء حساب</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="form-container active">
            <h2>مرحباً بعودتك</h2>
            <p class="sub">قم بتسجيل الدخول للوصول إلى الامتحانات</p>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="login-email" placeholder="البريد الإلكتروني" autocomplete="email">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="كلمة المرور">
                <i class="fas fa-eye-slash toggle-pw" data-target="login-password"></i>
            </div>
            <div class="forgot-link">
                <a href="#" id="forgot-password-link">نسيت كلمة المرور؟</a>
            </div>
            <button id="login-btn" class="action-btn">دخول <i class="fas fa-arrow-left"></i></button>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="form-container">
            <h2>انضم إلينا</h2>
            <p class="sub">أنشئ حسابك وابدأ رحلتك التعليمية</p>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="reg-name" placeholder="الاسم الكامل">
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="البريد الإلكتروني">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="reg-password" placeholder="كلمة المرور">
                <i class="fas fa-eye-slash toggle-pw" data-target="reg-password"></i>
            </div>
            <div class="input-group">
                <i class="fas fa-check-circle"></i>
                <input type="password" id="reg-confirm-pw" placeholder="تأكيد كلمة المرور">
                <i class="fas fa-eye-slash toggle-pw" data-target="reg-confirm-pw"></i>
            </div>
            <button id="register-btn" class="action-btn">إنشاء حساب <i class="fas fa-user-plus"></i></button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>جاري المعالجة...</p>
    </div>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
