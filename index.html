<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة علامة مائية للصور</title>
    <style>
        /* ====== الأنماط الحالية (بدون تعديل) ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 700;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
            transform: scale(1.01);
        }

        .upload-area.dragover {
            border-color: #00b894;
            background: #e8f8f5;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
        }

        .upload-text span {
            color: #667eea;
            font-weight: 600;
            text-decoration: underline;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .preview-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            margin: 10px 0;
        }

        .image-name {
            color: #555;
            font-size: 14px;
            margin: 8px 0;
            background: #f0f0f0;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 8px;
            display: none;
        }

        .progress-bar-container.active {
            display: block;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            display: none;
        }

        .progress-text.active {
            display: block;
        }

        .gallery-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e8e8e8;
        }

        .gallery-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
            border: 2px solid transparent;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .gallery-item.active {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px #764ba2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(255, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .gallery-item .delete-btn:hover {
            transform: scale(1.2);
            background: #ff0000;
        }

        .gallery-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e17055 0%, #d63031 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 48, 49, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.4);
        }

        .watermark-settings {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .watermark-settings label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .watermark-settings input,
        .watermark-settings textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            transition: border-color 0.3s ease;
        }

        .watermark-settings input:focus,
        .watermark-settings textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .watermark-settings textarea {
            resize: vertical;
            min-height: 60px;
        }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        /* ====== تحسينات للعلامة المائية ====== */
        .watermark-preview-info {
            margin-top: 10px;
            padding: 10px;
            background: #e8f0fe;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            display: none;
        }

        .watermark-preview-info.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .watermark-preview-info strong {
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 22px;
            }

            .settings-row {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ إضافة علامة مائية للصور</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">
                اسحب الصور هنا أو <span>اختر من الجهاز</span>
                <br>
                <small style="color: #999;">يدعم اختيار أكثر من صورة</small>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">جاري الرفع: 0%</div>

        <div class="gallery-container" id="galleryContainer">
            <div class="gallery-title">
                <span>📸 المعرض</span>
                <span style="font-size:14px; color:#999;" id="galleryCount">0 صورة</span>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="previewImage" class="preview-image" alt="الصورة المرفوعة">
            <div class="image-name" id="imageName">اسم الصورة: example.jpg</div>
        </div>

        <div class="watermark-settings">
            <label for="watermarkText">✏️ نص العلامة المائية:</label>
            <textarea id="watermarkText" placeholder="اكتب النص الذي تريد إضافته كعلامة مائية...">@mo7_2008</textarea>

            <div class="settings-row">
                <div>
                    <label for="opacity">🔆 شفافية العلامة المائية:</label>
                    <input type="range" id="opacity" min="0.05" max="0.5" step="0.05" value="0.15">
                    <span id="opacityValue">15%</span>
                </div>
                <div>
                    <label for="patternDensity">📐 كثافة النمط:</label>
                    <input type="range" id="patternDensity" min="1" max="5" step="0.5" value="2.5">
                    <span id="densityValue">2.5</span>
                </div>
            </div>
            
            <div class="watermark-preview-info" id="watermarkInfo">
                <strong>📊 معلومات العلامة المائية الديناميكية:</strong><br>
                <span id="watermarkDetails">في انتظار معاينة الصورة...</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-success" id="downloadBtn" disabled>
                ⬇️ تحميل الصورة بالعلامة المائية
            </button>
            <button class="btn btn-danger" id="resetBtn">
                🔄 إعادة تعيين
            </button>
        </div>

        <p style="text-align: center; margin-top: 20px; color: #999; font-size: 13px;">
            💡 تم حفظ آخر 5 صور في المتصفح الخاص بك
        </p>
    </div>

    <script>
        // ============================================================
        // الكود الحالي + علامة مائية احترافية ديناميكية
        // ============================================================

        // ====== المتغيرات الأساسية ======
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const imageName = document.getElementById('imageName');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const watermarkText = document.getElementById('watermarkText');
        const opacity = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacityValue');
        const patternDensity = document.getElementById('patternDensity');
        const densityValue = document.getElementById('densityValue');
        const watermarkInfo = document.getElementById('watermarkInfo');
        const watermarkDetails = document.getElementById('watermarkDetails');

        const galleryGrid = document.getElementById('galleryGrid');
        const galleryCount = document.getElementById('galleryCount');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let currentImage = null;
        let currentFileName = '';
        let currentImageObj = null; // حفظ كائن الصورة
        const MAX_GALLERY_ITEMS = 5;

        // ====== تحميل الصور المحفوظة ======
        function loadGalleryFromStorage() {
            return JSON.parse(localStorage.getItem('galleryImages') || '[]');
        }

        function saveGalleryToStorage(images) {
            if (images.length > MAX_GALLERY_ITEMS) {
                images = images.slice(-MAX_GALLERY_ITEMS);
            }
            localStorage.setItem('galleryImages', JSON.stringify(images));
            updateGalleryCount();
        }

        function updateGalleryCount() {
            const images = loadGalleryFromStorage();
            galleryCount.textContent = `${images.length} صورة`;
        }

        // ====== عرض المعرض ======
        function renderGallery() {
            const images = loadGalleryFromStorage();
            galleryGrid.innerHTML = '';

            if (images.length === 0) {
                galleryGrid.innerHTML = '<div class="gallery-empty">📭 لا توجد صور محفوظة</div>';
                return;
            }

            images.forEach((imageData, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                if (currentImage && imageData === currentImage) {
                    item.classList.add('active');
                }

                const img = document.createElement('img');
                img.src = imageData;
                img.alt = `صورة ${index + 1}`;
                img.loading = 'lazy';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'حذف الصورة';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteImageFromGallery(index);
                });

                item.addEventListener('click', () => {
                    displayImageFromGallery(imageData, `صورة ${index + 1}`);
                });

                item.appendChild(img);
                item.appendChild(deleteBtn);
                galleryGrid.appendChild(item);
            });
        }

        // ====== عرض صورة من المعرض ======
        function displayImageFromGallery(imageData, fileName) {
            currentImage = imageData;
            currentFileName = fileName || 'صورة من المعرض';
            previewImage.src = imageData;
            imageName.textContent = `اسم الصورة: ${currentFileName}`;
            previewContainer.classList.add('active');
            downloadBtn.disabled = false;
            
            // تحميل الصورة ككائن لحساب الأبعاد
            const img = new Image();
            img.onload = function() {
                currentImageObj = img;
                updateWatermarkInfo(img.width, img.height);
            };
            img.src = imageData;
            
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.classList.remove('active');
            });
            const items = document.querySelectorAll('.gallery-item');
            const images = loadGalleryFromStorage();
            const index = images.indexOf(imageData);
            if (index !== -1 && items[index]) {
                items[index].classList.add('active');
            }
            
            progressContainer.classList.remove('active');
            progressText.classList.remove('active');
        }

        // ====== حذف صورة ======
        function deleteImageFromGallery(index) {
            const images = loadGalleryFromStorage();
            if (index >= 0 && index < images.length) {
                const deletedImage = images[index];
                images.splice(index, 1);
                saveGalleryToStorage(images);
                renderGallery();
                if (currentImage === deletedImage) {
                    resetPreview();
                }
            }
        }

        // ====== إعادة تعيين ======
        function resetPreview() {
            currentImage = null;
            currentFileName = '';
            currentImageObj = null;
            previewContainer.classList.remove('active');
            previewImage.src = '';
            imageName.textContent = '';
            downloadBtn.disabled = true;
            watermarkInfo.classList.remove('active');
            
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.classList.remove('active');
            });
            
            progressContainer.classList.remove('active');
            progressText.classList.remove('active');
        }

        // ====== إضافة صورة جديدة ======
        function addImageToGallery(imageData, fileName) {
            let images = loadGalleryFromStorage();
            images.push(imageData);
            if (images.length > MAX_GALLERY_ITEMS) {
                images = images.slice(-MAX_GALLERY_ITEMS);
            }
            saveGalleryToStorage(images);
            renderGallery();
            displayImageFromGallery(imageData, fileName);
        }

        // ====== حذف جميع الصور ======
        function clearAllGallery() {
            if (confirm('⚠️ هل أنت متأكد من حذف جميع الصور المحفوظة؟')) {
                localStorage.removeItem('galleryImages');
                renderGallery();
                resetPreview();
                updateGalleryCount();
            }
        }

        // ====== معالجة الملفات ======
        function handleFiles(files) {
            if (files.length === 0) return;

            progressContainer.classList.add('active');
            progressText.classList.add('active');
            
            let processed = 0;
            const total = files.length;

            Array.from(files).forEach((file, index) => {
                if (!file.type.startsWith('image/')) {
                    processed++;
                    updateProgress(processed, total);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    addImageToGallery(imageData, file.name);
                    processed++;
                    updateProgress(processed, total);
                };

                reader.onerror = function() {
                    processed++;
                    updateProgress(processed, total);
                };

                reader.readAsDataURL(file);
            });
        }

        // ====== تحديث شريط التقدم ======
        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `جاري الرفع: ${percent}%`;
            
            if (percent === 100) {
                setTimeout(() => {
                    progressContainer.classList.remove('active');
                    progressText.classList.remove('active');
                    progressBar.style.width = '0%';
                }, 500);
            }
        }

        // ====== تحديث معلومات العلامة المائية ======
        function updateWatermarkInfo(width, height) {
            const aspectRatio = (width / height).toFixed(2);
            const fontSize = Math.min(width, height) * 0.08;
            const spacing = Math.min(width, height) * 0.25;
            
            watermarkInfo.classList.add('active');
            watermarkDetails.innerHTML = `
                📐 أبعاد الصورة: ${width} × ${height} بكسل<br>
                📊 نسبة الأبعاد: ${aspectRatio}<br>
                📏 حجم الخط التلقائي: ${Math.round(fontSize)} بكسل<br>
                📐 المسافة بين التكرارات: ${Math.round(spacing)} بكسل<br>
                🔄 زاوية الميل: 20 درجة<br>
                🎯 كثافة النمط: ${patternDensity.value}
            `;
        }

        // ====== العلامة المائية الاحترافية ======
        function addProfessionalWatermark(imageData) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // الحفاظ على الأبعاد الأصلية
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        // رسم الصورة الأصلية بجودة عالية
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // ====== إعدادات العلامة المائية الديناميكية ======
                        const text = watermarkText.value || '@mo7_2008';
                        const opacityValue = parseFloat(opacity.value) || 0.15;
                        const density = parseFloat(patternDensity.value) || 2.5;
                        
                        // حساب حجم الخط ديناميكياً (8% من أصغر بُعد)
                        const minDimension = Math.min(canvas.width, canvas.height);
                        const fontSize = Math.max(20, minDimension * 0.08);
                        
                        // حساب المسافة بين التكرارات بناءً على كثافة النمط
                        const spacing = minDimension * 0.25 / density;
                        
                        // زاوية الميل (20 درجة)
                        const angle = 20 * Math.PI / 180;
                        
                        // ====== رسم العلامة المائية بنمط شبكي ======
                        ctx.save();
                        
                        // إعدادات النص
                        ctx.font = `bold ${fontSize}px 'Tajawal', 'Arial', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.globalAlpha = opacityValue;
                        
                        // حساب عدد التكرارات لتغطية كامل الصورة
                        const textWidth = ctx.measureText(text).width;
                        const textHeight = fontSize * 1.2;
                        
                        // حساب المسافات مع مراعاة الزاوية
                        const stepX = spacing * 1.5;
                        const stepY = spacing * 1.2;
                        
                        // إزاحة لتوزيع النمط بشكل متساوي
                        const offsetX = (canvas.width % stepX) / 2;
                        const offsetY = (canvas.height % stepY) / 2;
                        
                        // رسم النمط الشبكي المائل
                        for (let x = -stepX; x < canvas.width + stepX; x += stepX) {
                            for (let y = -stepY; y < canvas.height + stepY; y += stepY) {
                                ctx.save();
                                ctx.translate(x + offsetX, y + offsetY);
                                ctx.rotate(angle);
                                
                                // ظل خفيف للنص
                                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                                ctx.shadowBlur = 8;
                                ctx.shadowOffsetX = 2;
                                ctx.shadowOffsetY = 2;
                                
                                // النص الرئيسي باللون الأبيض
                                ctx.fillStyle = '#ffffff';
                                ctx.fillText(text, 0, 0);
                                
                                // طبقة ثانية للوضوح بدون ظل
                                ctx.shadowColor = 'transparent';
                                ctx.shadowBlur = 0;
                                ctx.shadowOffsetX = 0;
                                ctx.shadowOffsetY = 0;
                                
                                // تكرار النص بدرجة وضوح أقل للطبقة الثانية
                                ctx.globalAlpha = opacityValue * 0.5;
                                ctx.fillStyle = '#ffffff';
                                ctx.fillText(text, 2, 2);
                                
                                ctx.restore();
                            }
                        }
                        
                        // ====== طبقة إضافية خفيفة في المنتصف ======
                        ctx.save();
                        ctx.globalAlpha = opacityValue * 0.3;
                        ctx.font = `bold ${fontSize * 1.5}px 'Tajawal', 'Arial', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                        ctx.shadowBlur = 15;
                        ctx.shadowOffsetX = 3;
                        ctx.shadowOffsetY = 3;
                        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                        ctx.restore();
                        
                        ctx.restore();
                        
                        // التصدير بجودة عالية دون ضغط
                        resolve(canvas.toDataURL('image/png', 1.0));
                        
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = function() {
                    reject(new Error('فشل تحميل الصورة'));
                };
                img.src = imageData;
            });
        }

        // ====== تحميل الصورة بالعلامة المائية ======
        async function downloadImageWithWatermark() {
            if (!currentImage) {
                alert('الرجاء اختيار صورة أولاً!');
                return;
            }

            try {
                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ جاري المعالجة...';
                
                // إضافة العلامة المائية الاحترافية
                const watermarkedImage = await addProfessionalWatermark(currentImage);
                
                // تحميل الصورة
                const link = document.createElement('a');
                const fileName = currentFileName.replace(/\.[^/.]+$/, '');
                link.download = `${fileName}_watermarked.png`;
                link.href = watermarkedImage;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                downloadBtn.textContent = '✅ تم التحميل بنجاح!';
                setTimeout(() => {
                    downloadBtn.textContent = '⬇️ تحميل الصورة بالعلامة المائية';
                    downloadBtn.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error('خطأ:', error);
                alert('حدث خطأ أثناء معالجة الصورة: ' + error.message);
                downloadBtn.textContent = '⬇️ تحميل الصورة بالعلامة المائية';
                downloadBtn.disabled = false;
            }
        }

        // ====== تحديث قيم الرينج ======
        opacity.addEventListener('input', function() {
            opacityValue.textContent = `${Math.round(this.value * 100)}%`;
            if (currentImageObj) {
                updateWatermarkInfo(currentImageObj.width, currentImageObj.height);
            }
        });

        patternDensity.addEventListener('input', function() {
            densityValue.textContent = this.value;
            if (currentImageObj) {
                updateWatermarkInfo(currentImageObj.width, currentImageObj.height);
            }
        });

        // ====== أحداث رفع الصور ======
        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                handleFiles(this.files);
            }
            this.value = '';
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        // ====== أزرار التحكم ======
        downloadBtn.addEventListener('click', downloadImageWithWatermark);

        resetBtn.addEventListener('click', function(e) {
            resetPreview();
        });

        resetBtn.addEventListener('dblclick', function(e) {
            clearAllGallery();
        });

        // ====== تهيئة الصفحة ======
        function init() {
            renderGallery();
            updateGalleryCount();
            downloadBtn.disabled = true;
            progressContainer.classList.remove('active');
            progressText.classList.remove('active');
            
            const images = loadGalleryFromStorage();
            if (images.length > 0) {
                const lastImage = images[images.length - 1];
                displayImageFromGallery(lastImage, `صورة ${images.length}`);
            }
        }

        init();

        // ====== توافق الهواتف ======
        if ('ontouchstart' in window) {
            uploadArea.style.padding = '40px 20px';
        }

        console.log('✅ تم تحميل الصفحة مع العلامة المائية الاحترافية!');
        console.log('📸 مميزات العلامة المائية:');
        console.log('  • حجم خط ديناميكي حسب أبعاد الصورة');
        console.log('  • نمط شبكي مائل بزاوية 20 درجة');
        console.log('  • شفافية منخفضة للحفاظ على المحتوى');
        console.log('  • ظل خفيف للنص لتحسين الوضوح');
        console.log('  • تغطية كاملة للصورة بغض النظر عن الأبعاد');
        console.log('  • جودة عالية بدون ضغط أثناء التصدير');
    </script>
</body>
</html>
