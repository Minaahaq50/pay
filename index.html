<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الحماية بالعلامة المائية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }

        .card {
            background: #161a1e;
            border-radius: 40px;
            padding: 28px 22px 35px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px #2e333a inset;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }

        h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 1px;
            color: #ececec;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            border-bottom: 1px solid #2b3138;
            padding-bottom: 18px;
        }

        h1 small {
            font-size: 1rem;
            font-weight: 300;
            color: #a8b2c0;
            margin-left: auto;
            background: #252b33;
            padding: 6px 16px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .grid-2 {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 18px;
        }

        .col {
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .drop-zone {
            background: #1f252c;
            border: 2px dashed #3d454f;
            border-radius: 32px;
            padding: 40px 20px;
            text-align: center;
            color: #b9c4d0;
            transition: 0.25s;
            cursor: pointer;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .drop-zone:hover {
            border-color: #d4af37;
            background: #252e38;
        }

        .drop-zone .icon {
            font-size: 3.8rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px #00000055);
            margin-bottom: 8px;
        }

        .drop-zone p {
            font-weight: 300;
            font-size: 1.2rem;
        }

        .drop-zone .hint {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        .preview-wrapper {
            background: #111418;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 20px #00000066, 0 0 0 1px #2f363f inset;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            max-height: 600px;
            position: relative;
        }

        #canvasPreview {
            display: block;
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain;
            background: #0e1115;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
        }

        .btn {
            background: #2c343e;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0f3f8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
            box-shadow: 0 4px 8px #00000044;
            border: 1px solid #3b4552;
        }

        .btn-primary {
            background: #d4af37;
            color: #11181f;
            border-color: #e8c84a;
            box-shadow: 0 6px 14px #d4af3740;
        }

        .btn-primary:hover {
            background: #e2bc44;
            transform: scale(1.02);
            box-shadow: 0 8px 20px #d4af3760;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .badge {
            background: #1f2a33;
            padding: 8px 18px;
            border-radius: 40px;
            color: #c9d4e0;
            font-size: 0.9rem;
            border: 1px solid #3b4552;
            white-space: nowrap;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #5f6c7c;
            text-align: center;
            border-top: 1px solid #232a32;
            padding-top: 22px;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-note span {
            background: #1b222a;
            padding: 5px 15px;
            border-radius: 30px;
        }

        /* responsive */
        @media (max-width: 700px) {
            .card {
                padding: 18px 12px 25px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .btn {
                padding: 12px 18px;
                font-size: 1rem;
                flex: 1 1 100%;
            }
            .drop-zone {
                padding: 30px 12px;
                min-height: 150px;
            }
            .preview-wrapper {
                min-height: 220px;
                max-height: 420px;
            }
        }

        /* scroll */
        ::-webkit-scrollbar {
            width: 6px;
            background: #13181e;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            🛡️ حماية الصور
            <small>علامة مائية</small>
        </h1>

        <div class="grid-2">
            <div class="col">
                <div class="drop-zone" id="dropZone">
                    <div class="icon">🖼️</div>
                    <p><strong>اسحب الصورة</strong> أو اضغط للرفع</p>
                    <div class="hint">JPG, PNG, WebP</div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div class="actions">
                    <button class="btn btn-primary" id="downloadBtn" disabled>
                        ⬇️ تحميل PNG عالي الجودة
                    </button>
                </div>
                <div style="font-size: 0.9rem; color: #7a889a; padding: 0 6px;">
                    ⚡ يتم تطبيق الختم تلقائياً بعد الرفع
                </div>
            </div>

            <div class="col">
                <div class="preview-wrapper">
                    <canvas id="canvasPreview"></canvas>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap;">
                    <span class="badge">📐 45° مائل</span>
                    <span class="badge">✨ ذهبي #d4af37</span>
                    <span class="badge">🔁 نمط قطري</span>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span>🔒 العلامة المائية تغطي مساحة كبيرة · شفافية 12%</span>
            <span>📌 <strong>𝑬𝒍 𝑱𝒐𝒌𝒆𝒓 𝑫𝒆𝒗</strong> · t.me/goo_cker</span>
        </div>
    </div>
    <script>
        (function() {
            // ----- عناصر -----
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            const canvas = document.getElementById('canvasPreview');
            const ctx = canvas.getContext('2d');
            const downloadBtn = document.getElementById('downloadBtn');

            // ----- متغيرات -----
            let originalImage = null;       // Image  object
            let isWatermarked = false;

            // ----- دالة الرسم الأساسية (تطبيق الختم) -----
            function drawWatermark(imageObj) {
                if (!imageObj) return;

                // 1) ضبط أبعاد canvas بحجم الصورة الأصلية (جودة عالية)
                const imgWidth = imageObj.naturalWidth || imageObj.width;
                const imgHeight = imageObj.naturalHeight || imageObj.height;
                canvas.width = imgWidth;
                canvas.height = imgHeight;

                // 2) رسم الصورة الأصلية
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(imageObj, 0, 0, canvas.width, canvas.height);

                // 3) إنشاء خلفية واقية كبيرة جداً (علامة مائية خلفية شفافة)
                //    نرسم دائرة/مستطيل كبير جداً في المنتصف بدرجة شفافية عالية (أقل من 5%)
                const gradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 50,
                    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.7
                );
                gradient.addColorStop(0, 'rgba(212, 175, 55, 0.018)');   // شفافية خفيفة جداً
                gradient.addColorStop(0.5, 'rgba(212, 175, 55, 0.03)');
                gradient.addColorStop(1, 'rgba(212, 175, 55, 0.005)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // نضيف شبكة خفيفة جداً كخلفية حماية إضافية (شبه غير مرئية)
                ctx.globalAlpha = 0.025;
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = Math.max(canvas.width, canvas.height) * 0.008;
                for (let i = -canvas.height; i < canvas.width * 2; i += 180) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + canvas.height, canvas.height);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;

                // ----- 4) النص الأساسي (علامة مائية مكرر قطري بزاوية 45°) -----
                const texts = [
                    '𝑬𝒍 𝑱𝒐𝒌𝒆𝒓 𝑫𝒆𝒗',
                    't.me/goo_cker'
                ];

                // اختيار حجم خط مناسب يتناسب مع مساحة الصورة
                const baseSize = Math.min(canvas.width, canvas.height) * 0.095;
                const fontSize = Math.max(24, Math.min(120, baseSize));
                const spacing = Math.min(canvas.width, canvas.height) * 0.5; // تكرار منتظم

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                // تعيين اللون الذهبي مع شفافية 10-15% (نستخدم 12%)
                const goldColor = 'rgba(212, 175, 55, 0.12)';

                // دوران 45 درجة حول المركز
                const angle = Math.PI / 4; // 45°
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                // نحدد عدد التكرارات حسب حجم الصورة (تغطية كاملة)
                const stepX = spacing * 1.2;
                const stepY = spacing * 1.2;
                const offsetX = canvas.width / 2;
                const offsetY = canvas.height / 2;

                // نرسم النص في شبكة مائلة
                ctx.save();
                ctx.translate(offsetX, offsetY);
                ctx.rotate(angle);

                // نرسم فوق المساحة كلها
                const rangeX = Math.ceil((canvas.width * 1.6) / stepX);
                const rangeY = Math.ceil((canvas.height * 1.6) / stepY);

                for (let i = -rangeX; i <= rangeX; i++) {
                    for (let j = -rangeY; j <= rangeY; j++) {
                        const x = i * stepX;
                        const y = j * stepY;

                        // نرسم السطر الأول (بخط أكبر)
                        ctx.font = `700 ${fontSize * 0.9}px 'Segoe UI', 'Times New Roman', serif`;
                        ctx.fillStyle = goldColor;
                        ctx.shadowBlur = 22;
                        ctx.fillText(texts[0], x, y - fontSize * 0.3);

                        // نرسم السطر الثاني (بخط أصغر قليلاً)
                        ctx.font = `500 ${fontSize * 0.6}px 'Segoe UI', 'Arial', sans-serif`;
                        ctx.fillStyle = 'rgba(212, 175, 55, 0.10)';
                        ctx.shadowBlur = 18;
                        ctx.fillText(texts[1], x, y + fontSize * 0.55);
                    }
                }

                // نعيد رسم طبقة خفيفة جداً فوق النص لدمج أفضل (حماية إضافية)
                ctx.restore();

                // إضافة علامة مائية كبيرة جداً في المنتصف (نص ضخم شفاف جداً)
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(angle);
                ctx.font = `bold ${Math.min(canvas.width, canvas.height) * 0.8}px 'Times New Roman', serif`;
                ctx.fillStyle = 'rgba(212, 175, 55, 0.022)';
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#d4af3755';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('𝑬𝒍 𝑱𝒐𝒌𝒆𝒓', 0, -20);
                ctx.fillStyle = 'rgba(212, 175, 55, 0.018)';
                ctx.font = `300 ${Math.min(canvas.width, canvas.height) * 0.35}px 'Segoe UI', sans-serif`;
                ctx.fillText('t.me/goo_cker', 0, fontSize * 0.5 + 20);
                ctx.restore();

                // أخيراً نعيد رسم حدود خفيفة جداً على الحواف لمنع القص (شبكة محيطية)
                ctx.globalAlpha = 0.03;
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = Math.max(canvas.width, canvas.height) * 0.01;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 1.0;

                // تم التطبيق
                isWatermarked = true;
                downloadBtn.disabled = false;
            }

            // ----- معالجة الصورة بعد التحميل -----
            function handleImage(file) {
                if (!file || !file.type.startsWith('image/')) {
                    alert('الرجاء اختيار صورة صالحة');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        originalImage = img;
                        drawWatermark(img);
                    };
                    img.onerror = function() {
                        alert('تعذر قراءة الصورة، حاول مرة أخرى');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // ----- رفع الملف من الإدخال -----
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleImage(this.files[0]);
                }
                this.value = ''; // لإعادة الرفع لنفس الملف
            });

            // ----- السحب والإفلات -----
            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#d4af37';
                this.style.backgroundColor = '#29333f';
            });

            dropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.style.borderColor = '#3d454f';
                this.style.backgroundColor = '#1f252c';
            });

            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#3d454f';
                this.style.backgroundColor = '#1f252c';
                const files = e.dataTransfer.files;
                if (files && files[0]) {
                    handleImage(files[0]);
                }
            });

            // الضغط على منطقة الإفلات لفتح المستعرض
            dropZone.addEventListener('click', function() {
                fileInput.click();
            });

            // ----- تحميل الصورة النهائية PNG عالية الجودة -----
            downloadBtn.addEventListener('click', function() {
                if (!isWatermarked || !originalImage) return;

                // نعيد الرسم بدقة عالية (إذا كان canvas قد غُير لأي سبب)
                drawWatermark(originalImage);

                // تصدير PNG بجودة عالية (بدون فقدان)
                const link = document.createElement('a');
                link.download = `watermarked_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            });

            // ----- تحميل صورة تجريبية (اختيارية) -----
            // (لن نضع أي صورة افتراضية، نترك المستخدم يرفع)

            // ----- إعادة الرسم عند تغيير حجم النافذة (ليس ضرورياً) -----
            // لكن نمنع أي إعادة رسم تلقائي لأننا نعتمد على الصورة.

            console.log('✅ موقع الحماية بالعلامة المائية جاهز');
        })();
    </script>
</body>
</html>
