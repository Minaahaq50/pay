<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📤 إثبات التحويل - المنصة الثانوية بلس</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#000,#0d0d0d,#141414);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  overflow:hidden;
}

.container{
  background:rgba(25,25,25,0.95);
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(0,0,0,0.8);
  max-width:430px;
  width:100%;
  text-align:center;
  backdrop-filter:blur(6px);
  position:relative;
  overflow:hidden;
}
.container::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg,#00f5c4,#00bcd4,#00f5c4);
  animation:moveBar 3s linear infinite;
}
@keyframes moveBar{
  0%{background-position:0 0;}
  100%{background-position:400px 0;}
}
h2{
  color:#00f5c4;
  margin-bottom:22px;
  font-size:22px;
  letter-spacing:1px;
}

label{
  display:block;
  text-align:right;
  margin-top:12px;
  font-size:15px;
  font-weight:600;
  color:#ddd;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:15px;
  outline:none;
  transition:0.3s;
}
input:focus{
  box-shadow:0 0 6px #00f5c4;
  transform:scale(1.02);
}

button{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#00f5c4,#00bcd4);
  color:#111;
  font-weight:bold;
  border:none;
  border-radius:10px;
  margin-top:20px;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
  box-shadow:0 0 10px rgba(0,245,196,0.3);
}
button:hover{
  transform:scale(1.03);
  box-shadow:0 0 15px rgba(0,245,196,0.6);
}
button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

#status{
  margin-top:18px;
  font-size:15px;
  line-height:1.6;
  color:#ccc;
}

.preview img{
  max-width:200px;
  border-radius:10px;
  margin-top:15px;
  border:1px solid #333;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

/* تحميل متحرك */
.loader{
  width:40px;
  height:40px;
  border:4px solid #222;
  border-top:4px solid #00f5c4;
  border-radius:50%;
  margin:10px auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{
  100%{transform:rotate(360deg);}
}
</style>
</head>
<body>
<div class="container">
  <h2>📤 إرسال إثبات التحويل</h2>

  <label>الاسم المسجل في المنصة</label>
  <input type="text" id="name" placeholder="مثال: محمد علي">

  <label>الرقم المسجل في المنصة</label>
  <input type="text" id="studentNumber" placeholder="مثال: 010xxxxxxx">

  <label>الرقم الذي تم التحويل منه</label>
  <input type="text" id="fromNumber" placeholder="مثال: 011xxxxxxx">

  <label>صورة إيصال التحويل (سكرين)</label>
  <input type="file" id="image" accept="image/*">

  <button id="sendBtn">🚀 إرسال الإثبات الآن</button>

  <div id="status"></div>
  <div class="preview" id="preview"></div>
</div>

<script>
// ==== إعداد البوت ====
const BOT_TOKEN = "7671449403:AAEi3OueRekWgJBNWivgR5gbuQT4b3drSP4";
const RECEIVERS = [
  "7498653159", // رقمك
  "8370564028"  // رقم صاحبك
];

const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const preview = document.getElementById("preview");

sendBtn.addEventListener("click", async ()=>{
  const name = document.getElementById("name").value.trim();
  const studentNumber = document.getElementById("studentNumber").value.trim();
  const fromNumber = document.getElementById("fromNumber").value.trim();
  const file = document.getElementById("image").files[0];

  if(!name || !studentNumber || !fromNumber || !file){
    statusEl.innerHTML = "❌ الرجاء ملء جميع الحقول وإرفاق الصورة.";
    return;
  }

  if(!confirm("هل أنت متأكد من إرسال إثبات التحويل؟")) return;

  sendBtn.disabled = true;
  statusEl.innerHTML = `<div class="loader"></div> <p>⏳ جاري الإرسال للمنصة...</p>`;

  const caption = `
📢 *إثبات تحويل جديد للمنصة الثانوية بلس*
━━━━━━━━━━━━━
👤 الاسم: ${name}
📱 رقم المنصة: ${studentNumber}
💳 رقم المحول منه: ${fromNumber}
🕒 الوقت: ${new Date().toLocaleString("ar-EG")}
━━━━━━━━━━━━━
`;

  try{
    for(let chatId of RECEIVERS){
      const formData = new FormData();
      formData.append("chat_id", chatId);
      formData.append("caption", caption);
      formData.append("parse_mode", "Markdown");
      formData.append("photo", file);

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
        method:"POST",
        body:formData
      });
    }

    statusEl.innerHTML = "✅ تم إرسال الإثبات بنجاح، شكراً لتعاونك!";
    preview.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="إثبات التحويل">`;
  }catch(err){
    console.error(err);
    statusEl.innerHTML = "❌ فشل الإرسال، تحقق من الاتصال أو حاول لاحقًا.";
  }finally{
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
