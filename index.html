<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إثبات التحويل - المنصة الثانوية بلس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --main-color: #00e6b8;
  --bg-dark: #0a0a0a;
}
body {
  margin: 0;
  padding: 0;
  font-family: 'Tajawal', sans-serif;
  background: radial-gradient(circle at top, #0f0f0f, #000);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 30px;
  width: 95%;
  max-width: 430px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  margin-top: 20px;
}
h2 {
  text-align: center;
  color: var(--main-color);
  margin-bottom: 25px;
}

/* 📞 رقم التحويل */
.transfer-box {
  background: rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 25px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,230,184,0.3);
}
.transfer-box p {
  margin: 5px 0 10px;
  font-weight: bold;
}
.copy-field {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 10px 14px;
}
.copy-field span {
  font-size: 18px;
  font-weight: bold;
  color: var(--main-color);
  user-select: text;
}
.copy-icon {
  cursor: pointer;
  font-size: 20px;
  color: #fff;
  transition: 0.3s;
}
.copy-icon:hover {
  color: var(--main-color);
  transform: scale(1.1);
}

/* 🪄 Toast */
.toast {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 14px 20px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s, transform 0.4s;
  transform: translateY(20px);
  z-index: 9999;
}
.toast.show {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}
.toast.success {border-right: 4px solid #00e676;}
</style>
</head>

<body>
<div class="container">
  <h2>إثبات التحويل</h2>

  <!-- ✅ رقم التحويل الرسمي -->
  <div class="transfer-box">
    <p>📞 الرقم الرسمي للتحويل:</p>
    <div class="copy-field">
      <span id="transferNumber">01225587394</span>
      <span class="copy-icon" id="copyIcon">📋</span>
    </div>
  </div>

  <p style="text-align:center;color:#aaa;font-size:14px">
    الرجاء تحويل المبلغ إلى الرقم الموضح أعلاه، ثم إرفاق سكرين التحويل في النموذج أدناه.
  </p>
</div>

<div class="toast" id="toast">تم النسخ ✅</div>

<script>
const copyIcon = document.getElementById("copyIcon");
const transferNumber = document.getElementById("transferNumber");
const toast = document.getElementById("toast");

copyIcon.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(transferNumber.textContent);
    toast.textContent = "✅ تم نسخ الرقم بنجاح";
    toast.classList.add("show", "success");
    setTimeout(() => toast.classList.remove("show"), 2500);
  } catch {
    toast.textContent = "❌ لم يتم النسخ، انسخ يدويًا";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }
});
</script>
</body>
</html>
