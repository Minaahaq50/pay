<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner Effect Exam</title>
  <style>
    /* reset & base */
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      background: #2b2b2b;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 20px;
    }

    /* الورقة الرئيسية */
    .paper {
      max-width: 860px;
      width: 100%;
      background: #f7f1e3;
      padding: 24px 24px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: box-shadow 0.2s;
    }

    /* إطار الصورة مع تأثير الورق */
    .exam-image-wrapper {
      position: relative;
      overflow: hidden;
      border: 3px solid #b89b6b;
      border-radius: 14px;
      background: #e5dccd;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.08);
    }

    /* الصورة + تأثير الـ scan (يُطبق عبر JS أيضاً لكن نحتفظ بالكلاس) */
    .scan-effect {
      display: block;
      width: 100%;
      height: auto;
      filter: contrast(1.18) brightness(1.06) saturate(0.88) sepia(0.04) blur(0.3px);
      transform: rotate(-0.2deg) scale(1.005);
      transition: filter 0.2s;
    }

    /* نسيج الورق (paper fibers) فوق الصورة */
    .exam-image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
      opacity: 0.13;
      mix-blend-mode: multiply;
      pointer-events: none;
      border-radius: 12px;
    }

    /* منطقة التحكم */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 22px;
    }

    /* زر الملف مخفي لكن نجعله شفاف مع تنسيق */
    .file-label {
      background: #3d3d3d;
      color: #f0eadb;
      padding: 12px 26px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid #5a5a5a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .file-label:hover {
      background: #4f4f4f;
      transform: scale(1.02);
      border-color: #b89b6b;
    }

    .file-label:active {
      transform: scale(0.96);
    }

    #file {
      display: none;
    }

    /* زر التحميل */
    .download-btn {
      background: #2c6e49;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(44, 110, 73, 0.4);
      letter-spacing: 0.5px;
      border: 1px solid #3d8b5a;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .download-btn:hover {
      background: #1f5a38;
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(44, 110, 73, 0.6);
    }

    .download-btn:active {
      transform: scale(0.95);
    }

    .download-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    /* رسالة ترحيب عند عدم وجود صورة */
    .placeholder-msg {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      background: #e8dfce;
      color: #6a5e4b;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px dashed #b89b6b;
      opacity: 0.7;
    }

    #img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* التكيف مع الشاشات الصغيرة */
    @media (max-width: 600px) {
      .paper {
        padding: 16px;
      }
      .controls {
        gap: 12px;
        flex-direction: column;
        align-items: stretch;
      }
      .file-label,
      .download-btn {
        justify-content: center;
        padding: 14px 16px;
      }
      .placeholder-msg {
        min-height: 120px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="paper">
    <!-- حاوية الصورة مع تأثير الورق -->
    <div class="exam-image-wrapper" id="imageWrapper">
      <img id="img" src="" alt="الصورة المرفوعة" style="display: none;" />
      <div class="placeholder-msg" id="placeholder">
        📄 اختر صورة لتفعيل تأثير الماسح الضوئي
      </div>
    </div>

    <!-- عناصر التحكم -->
    <div class="controls">
      <label for="file" class="file-label">
        <span>📂</span> اختيار صورة
      </label>
      <input type="file" id="file" accept="image/*" />

      <button class="download-btn" id="downloadBtn" disabled>
        ⬇️ تحميل مع Scan
      </button>
    </div>
  </div>

  <script>
    (function() {
      // عناصر DOM
      const fileInput = document.getElementById('file');
      const imgElement = document.getElementById('img');
      const placeholder = document.getElementById('placeholder');
      const downloadBtn = document.getElementById('downloadBtn');
      const imageWrapper = document.getElementById('imageWrapper');

      // تخزين الـ data URL للصورة الحالية
      let currentImageDataURL = null;
      // علم بوجود صورة
      let imageLoaded = false;

      // إظهار الصورة وتطبيق تأثير الـ scan (مع إخفاء placeholder)
      function displayImage(dataUrl) {
        currentImageDataURL = dataUrl;
        imgElement.src = dataUrl;
        imgElement.style.display = 'block';
        imgElement.classList.add('scan-effect');

        // إخفاء النص المؤقت
        if (placeholder) {
          placeholder.style.display = 'none';
        }

        imageLoaded = true;
        downloadBtn.disabled = false;
      }

      // معالجة رفع الملف
      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // التحقق من أنه صورة
        if (!file.type.startsWith('image/')) {
          alert('الرجاء اختيار ملف صورة صحيح');
          fileInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function(ev) {
          const result = ev.target.result;
          displayImage(result);
        };

        reader.onerror = function() {
          alert('حدث خطأ أثناء قراءة الملف');
          fileInput.value = '';
        };

        reader.readAsDataURL(file);
      });

      // --- دالة التحميل مع تأثير "سكان" كامل (باستخدام Canvas) ---
      function downloadScannedImage() {
        if (!currentImageDataURL) {
          alert('لا توجد صورة للتحميل');
          return;
        }

        // نستخدم Image لتحميل الصورة إلى Canvas
        const img = new Image();
        img.crossOrigin = 'anonymous'; // غير مطلوب لكن للأمان

        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // أبعاد الصورة الأصلية
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          canvas.width = w;
          canvas.height = h;

          // 1. تطبيق الفلاتر الأساسية (تباين، سطوع، تشبع، صبغة)
          ctx.filter = 'contrast(1.2) brightness(1.08) saturate(0.9) sepia(0.03)';
          ctx.drawImage(img, 0, 0, w, h);

          // 2. إضافة نسيج ورق (paper texture) عبر blend-mode و opacity
          //    نرسم فوقها texture شفاف باستخدام pattern (نفس الصورة الورقية)
          const textureImg = new Image();
          textureImg.crossOrigin = 'anonymous';
          textureImg.src = 'https://www.transparenttextures.com/patterns/paper-fibers.png';

          // لكن قد لا يتحمّل في الوقت المناسب، لذا نستخدم طريقة مباشرة:
          // نعدّل البيكسلات بإضافة noise خفيف (محاكاة خشونة الورق)
          // ثم نضيف تأثير الـ grain

          // (أ) نأخذ بيانات البيكسل ونضيف noise خفيف
          const imageData = ctx.getImageData(0, 0, w, h);
          const data = imageData.data;

          // نطبق noise خفيف جداً (يظهر كحبيبات ورق)
          for (let i = 0; i < data.length; i += 4) {
            // نطبق noise على قنوات RGB فقط (نترك alpha)
            const noise = (Math.random() - 0.5) * 7; // بين -3.5 و +3.5
            data[i] = Math.min(255, Math.max(0, data[i] + noise));
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
          }

          // نعيد البيانات المعدلة
          ctx.putImageData(imageData, 0, 0);

          // (ب) نضيف طبقة نسيج ورق (paper fibers) عبر pattern
          //    لكن لضمان عدم تأخر التحميل، نستخدم texture جاهزة ونرسمها
          //    بطريقة متزامنة: نخلق pattern من texture بعد تحميلها
          const textureCanvas = document.createElement('canvas');
          textureCanvas.width = w;
          textureCanvas.height = h;
          const tCtx = textureCanvas.getContext('2d');

          // نرسم الـ pattern من الصورة الورقية
          const paperPatternImg = new Image();
          paperPatternImg.crossOrigin = 'anonymous';
          paperPatternImg.src = 'https://www.transparenttextures.com/patterns/paper-fibers.png';

          // ولكن قد لا يكون جاهزاً في onload، لذا نستخدم الأسلوب التالي:
          // نرسم الصورة الأصلية مرة أخرى مع مزج pattern يدوياً (باستخدام drawImage مع opacity)
          // لكن للتبسيط: نضيف تأثير الورق عبر إعادة رسم الصورة مع opacity من texture بعد تحميلها.
          // الحل: نستخدم onload للـ pattern ونرسم فوق Canvas الأساسي
          // لكن لضمان عمل دالة التحميل، سنستخدم طريقة متسلسلة:

          // في حال لم يتحمل pattern، نستخدم Noise فقط مع تعديل طفيف (كافٍ)
          // لكننا نضيف أيضاً تأثير "ورق" عبر رسم الصورة مرتين بطريقة blend

          // الطريقة الأكثر استقراراً: نرسم الصورة مرة أخرى مع pattern
          // نضيف الـ texture كطبقة شفافة فوق الصورة باستخدام pattern
          const patternCanvas = document.createElement('canvas');
          patternCanvas.width = w;
          patternCanvas.height = h;
          const pCtx = patternCanvas.getContext('2d');

          // نرسم الصورة الأصلية (بدون filter) كخلفية
          pCtx.drawImage(img, 0, 0, w, h);

          // نضيف فوقها الـ pattern (نسيج الورق) مع opacity
          const pat = new Image();
          pat.crossOrigin = 'anonymous';
          pat.src = 'https://www.transparenttextures.com/patterns/paper-fibers.png';

          // نستعمل onload للتأكد من وجود texture
          pat.onload = function() {
            // نرسم pattern مكرر (repeat) فوق الصورة
            const pattern = pCtx.createPattern(pat, 'repeat');
            pCtx.globalAlpha = 0.16;
            pCtx.fillStyle = pattern;
            pCtx.fillRect(0, 0, w, h);

            // الآن ندمج مع canvas الأساسي: نرسم patternCanvas فوق canvas الأساسي مع blend-mode
            ctx.globalAlpha = 1.0;
            ctx.drawImage(patternCanvas, 0, 0);

            // إضافة تأثير خفيف جداً (blur أو حدة) لكن نكتفي بهذا

            // تحميل الصورة النهائية
            const link = document.createElement('a');
            link.download = 'scan_exam.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          };

          // في حال فشل تحميل pattern (مهلة) نستخدم البديل: فقط noise + بعض التعديل
          pat.onerror = function() {
            // نستخدم ما لدينا: noise مطبق + نضيف بعض التعديلات البسيطة
            // نعيد رسم الصورة مع إضافة شفافية بسيطة
            ctx.globalAlpha = 0.96;
            ctx.drawImage(img, 0, 0, w, h);
            ctx.globalAlpha = 1.0;

            // نضيف noise إضافي خفيف
            const imgData2 = ctx.getImageData(0, 0, w, h);
            const d2 = imgData2.data;
            for (let i = 0; i < d2.length; i += 4) {
              const n = (Math.random() - 0.5) * 5;
              d2[i] = Math.min(255, Math.max(0, d2[i] + n));
              d2[i + 1] = Math.min(255, Math.max(0, d2[i + 1] + n));
              d2[i + 2] = Math.min(255, Math.max(0, d2[i + 2] + n));
            }
            ctx.putImageData(imgData2, 0, 0);

            const link = document.createElement('a');
            link.download = 'scan_exam.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          };

          // نبدأ تحميل الـ pattern
          pat.src = 'https://www.transparenttextures.com/patterns/paper-fibers.png';
        };

        img.onerror = function() {
          alert('تعذر تحميل الصورة، يرجى المحاولة مرة أخرى');
        };

        img.src = currentImageDataURL;
      }

      // ربط زر التحميل
      downloadBtn.addEventListener('click', downloadScannedImage);

      // إعادة تعيين إذا تم اختيار ملف جديد بعد تحميل سابق
      // (لن نحتاج لأن displayImage تعيد ضبط كل شيء)

      // عند تحميل الصفحة، التأكد من أن placeholder ظاهر
      // ويمكن إضافة صورة افتراضية للعرض (اختياري)
      // نضيف مثال: عرض صورة تجريبية صغيرة (لتوضيح التأثير)
      // لكن الأفضل تركها فارغة مع رسالة.

      // دالة مساعدة لإعادة تعيين الحالة (اختياري)
      function resetState() {
        // لا نستخدمها حالياً
      }

      // (اختياري) إذا أراد المستخدم معاينة الصورة بدون رفع ملف
      // نضيف صورة تجريبية بشكل تلقائي؟ لكن الأفضل تركها للمستخدم.

      console.log('Scanner Effect Exam جاهز');
    })();
  </script>
</body>
</html>
